name: CI

on:
  push:
    branches: [main, 'upgrade/**']
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node:
    name: Lint, typecheck and test (TypeScript)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Engine coverage gate (80%+)
        run: npm run test:coverage
      - name: Dependency audit
        run: npm audit --audit-level=high

  python:
    name: Lint and test (ML service)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/ml
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: apps/ml/uv.lock
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest

  docker:
    name: Build images and smoke test
    needs: [node, python]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Create .env from the example
        run: cp .env.example .env
      - name: Build all images
        run: docker compose build
      - name: Start the stack
        run: docker compose up -d
      - name: Smoke test
        run: ./scripts/smoke.sh
      - name: Show logs on failure
        if: failure()
        run: docker compose logs --tail 100
      - name: Stop the stack
        if: always()
        run: docker compose down -v
