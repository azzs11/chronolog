name: CI

on:
  push:
    branches: [main, 'upgrade/**']
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node:
    name: Lint, typecheck and test (TypeScript)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Engine coverage gate (80%+)
        run: npm run test:coverage
      - name: Dependency audit
        run: npm audit --audit-level=high

  demo:
    name: Static demo (size budget and Lighthouse)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build the backend-free demo
        run: npm run build:demo -w chronolog-web
      - name: JavaScript size budget
        run: scripts/check-demo-size.sh
      - name: "Lighthouse (mobile): accessibility 95+, LCP under 3 s"
        run: npx --yes @lhci/cli@0.14.0 autorun --config=lighthouserc.json

  python:
    name: Lint and test (${{ matrix.directory }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        directory: [apps/ml, bench]
    defaults:
      run:
        working-directory: ${{ matrix.directory }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        if: matrix.directory == 'bench'
        with:
          node-version: 22
          cache: npm
      - name: Build the Node replay runner (needed by the bench integration test)
        if: matrix.directory == 'bench'
        working-directory: .
        run: |
          npm ci
          npm run build
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: '**/uv.lock'
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest

  docker:
    name: Build images and smoke test
    needs: [node, python]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Create .env from the example
        run: cp .env.example .env
      - name: Build all images
        run: docker compose build
      - name: Start the stack
        run: docker compose up -d
      - name: Smoke test
        run: ./scripts/smoke.sh
      - name: Show logs on failure
        if: failure()
        run: docker compose logs --tail 100
      - name: Stop the stack
        if: always()
        run: docker compose down -v
