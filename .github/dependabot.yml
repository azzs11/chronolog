version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    groups:
      actions: { patterns: ['*'] }
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly }
    groups:
      npm: { patterns: ['*'] }
  - package-ecosystem: uv
    directories: [/apps/ml, /bench]
    schedule: { interval: weekly }
    groups:
      python: { patterns: ['*'] }
  - package-ecosystem: docker
    directories: [/apps/api, /apps/web, /apps/ml]
    schedule: { interval: weekly }
