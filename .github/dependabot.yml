version: 2

# Routine updates (minor and patch) are grouped into one pull request per ecosystem. Major versions
# are NOT proposed automatically: each one is a migration (TypeScript, Express, Vite and Tailwind
# have all published majors that need code changes), so they are done by hand, one at a time, with
# the benchmark re-run if the engine is touched.
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    groups:
      actions: { patterns: ['*'] }
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly }
    groups:
      npm:
        patterns: ['*']
        update-types: [minor, patch]
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
  - package-ecosystem: uv
    directories: [/apps/ml, /bench]
    schedule: { interval: weekly }
    groups:
      python:
        patterns: ['*']
        update-types: [minor, patch]
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
  - package-ecosystem: docker
    directories: [/apps/api, /apps/web, /apps/ml]
    schedule: { interval: weekly }
    ignore:
      # The Node and Python base images follow the versions the project is built and tested on.
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
