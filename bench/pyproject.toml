[project]
name = "chronobench"
version = "2.0.0"
description = "ChronoBench: reproducible root-cause-analysis benchmark for ChronoLog"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "pyarrow>=17",
    "drain3>=0.9.11",
    "lightgbm>=4.5",
]

[project.scripts]
bench = "chronobench.cli:main"

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chronobench"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Long prose strings in the report template.
"src/chronobench/report.py" = ["E501"]
"src/chronobench/anomaly_report.py" = ["E501"]
"src/chronobench/anomaly_v2_report.py" = ["E501"]
"src/chronobench/rootrank_report.py" = ["E501"]
"src/chronobench/ablation_report.py" = ["E501"]
"src/chronobench/robustness_report.py" = ["E501"]
"src/chronobench/autostart_report.py" = ["E501"]
"src/chronobench/servicegraph_report.py" = ["E501"]
"src/chronobench/playground.py" = ["E501"]
"tests/test_anomaly_eval.py" = ["E501"]

# LightGBM is built from source without OpenMP so it loads on any machine with no system
# libraries (macOS wheels need Homebrew's libomp). The ranking data is tiny, so one thread is fast.
[tool.uv]
no-binary-package = ["lightgbm"]

[tool.uv.config-settings-package]
lightgbm = { "cmake.define.USE_OPENMP" = "OFF" }
