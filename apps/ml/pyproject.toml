[project]
name = "chronolog-ml"
version = "2.0.0"
description = "ChronoLog ML service: log severity classification (FastAPI)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "pydantic>=2.9",
    "scikit-learn>=1.5",
    "pandas>=2.2",
    "numpy>=2.0",
    "joblib>=1.4",
    "python-dotenv>=1.0",
    "prometheus-client>=0.21",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chronolog_ml"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Generated-style data file: long message strings and aligned kwargs are fine here.
"src/chronolog_ml/data_generator.py" = ["E501", "E251", "E221", "E241"]

[tool.ruff.format]
# Generated-style data file; reformatting it would only add noise.
exclude = ["src/chronolog_ml/data_generator.py"]
