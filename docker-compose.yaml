services:
  postgres:
    image: postgres:15-alpine
    container_name: chronolog_postgres
    mem_limit: 256m
    environment:
      POSTGRES_DB: chronolog
      POSTGRES_USER: debug_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-debug_secret}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./apps/api/db/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U debug_user -d chronolog"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - monitoring
    restart: on-failure

  ml-service:
    build: ./apps/ml
    container_name: chronolog_ml
    mem_limit: 512m
    ports:
      - "5001:5001"
    networks:
      - monitoring
    restart: on-failure
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5001/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

  backend:
    build: ./apps/api
    container_name: chronolog_backend
    mem_limit: 256m
    ports:
      # Host port defaults to 5050: macOS AirPlay Receiver holds 5000.
      - "${BACKEND_PORT:-5050}:5000"
    environment:
      DATABASE_URL: postgresql://debug_user:${POSTGRES_PASSWORD:-debug_secret}@postgres:5432/chronolog
      ML_SERVICE_URL: http://ml-service:5001
      CORS_ORIGIN: http://localhost:3000
      ADMIN_API_KEY: ${ADMIN_API_KEY:-dev_key_change_in_prod}
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
      ml-service:
        condition: service_healthy
    networks:
      - monitoring
    restart: on-failure
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5000/health"]
      interval: 30s
      timeout: 3s
      retries: 3

  frontend:
    build:
      context: ./apps/web
      args:
        REACT_APP_API_URL: http://localhost:${BACKEND_PORT:-5050}
        REACT_APP_WS_URL: http://localhost:${BACKEND_PORT:-5050}
    container_name: chronolog_frontend
    mem_limit: 64m
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - monitoring
    restart: on-failure

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    mem_limit: 256m
    profiles: ["monitoring"]
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - monitoring
    restart: on-failure

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    mem_limit: 256m
    profiles: ["monitoring"]
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:?set GRAFANA_PASSWORD in .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards
    networks:
      - monitoring
    restart: on-failure
    depends_on:
      - prometheus

networks:
  monitoring:
    driver: bridge

volumes:
  postgres_data:
  prometheus_data:
  grafana_data:
